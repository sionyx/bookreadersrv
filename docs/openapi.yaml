  /api/books/{bookID}/chapters/{chapterID}/audio:
    parameters:
      - $ref: '#/components/parameters/BookID'
      - $ref: '#/components/parameters/ChapterID'
    post:
      tags: [Books]
      operationId: uploadChapterAudio
      summary: Загрузить или заменить файл аудио главы
      description: |
        Бинарное тело запроса содержит один файл, без multipart-обёртки.
        MP3/M4A до 1073741824 байт (1 GiB), без перекодирования.
        Имя содержит текущего первого автора книги, название книги и chapter_NN.
        Автор определяется по первой роли author (createDate, затем UUID);
        при отсутствии роли используется authorId книги.
        Ответ возвращается после загрузки в S3 и обновления базы.
        Замена использует текущие имена сущностей и удаляет предыдущие объекты
        по сохранённым в базе ссылкам. Простое переименование не перемещает файлы.
        Медиаоперации одной сущности сериализованы обновлением ID без изменения значения через Fluent внутри транзакции.
        При ошибке выполняется попытка восстановить S3 из временных копий;
        ошибка неполного восстановления явно указана в reason.
      parameters:
        - name: chapterNumber
          in: query
          required: true
          description: Номер главы, начиная с 1; минимум две цифры в имени файла (chapter_01, chapter_100).
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/m4a:
            schema:
              type: string
              format: binary
          audio/x-m4a:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Медиа сохранено, ссылки в базе обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResult'
        '400':
          $ref: '#/components/responses/MediaError'
        '404':
          $ref: '#/components/responses/MediaError'
        '413':
          $ref: '#/components/responses/MediaError'
        '415':
          $ref: '#/components/responses/MediaError'
        '422':
          $ref: '#/components/responses/MediaError'
        '500':
          $ref: '#/components/responses/MediaError'
        '502':
          $ref: '#/components/responses/MediaError'
        '503':
          $ref: '#/components/responses/MediaError'
    delete:
      tags: [Books]
      operationId: deleteChapterAudio
      summary: Удалить аудиофайл аудио главы
      description: |
        Прямая ссылка должна относиться к настроенному бакету и быть связана
        с этой сущностью в базе. URL с query/fragment не принимаются.
        Удаляется аудиофайл главы.
        Отсутствующий объект в S3 считается удалённым. После удаления ссылки
        очищаются в базе. Если ссылка уже отвязана, возвращается 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaDeleteRequest'
      responses:
        '200':
          description: Медиа удалено, ссылки в базе очищены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResult'
        '400':
          $ref: '#/components/responses/MediaError'
        '404':
          $ref: '#/components/responses/MediaError'
        '500':
          $ref: '#/components/responses/MediaError'
        '502':
          $ref: '#/components/responses/MediaError'
        '503':
          $ref: '#/components/responses/MediaError'

