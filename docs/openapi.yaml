openapi: 3.0.3
info:
  title: Book Reader Server API
  version: 1.0.0
  description: |
    HTTP API серверной части приложения для чтения книг на Vapor.

    JSON API доступен под префиксом `/api`, а пользовательские HTML-страницы —
    под `/app`. Аутентификация и авторизация в текущей реализации не подключены.
    Медиаоперации не требуют отдельного токена; при размещении доступ к ним
    должен обеспечиваться авторизацией админки. Файлы передаются в бинарном
    теле запроса, синхронно сохраняются в S3, затем обновляются ссылки в базе.

    Поля `publishDate` в DTO книги и главы передаются как Unix time в секундах.
    Поля `createDate`, `updateDate` и `deleteDate` типа Swift `Date` кодируются
    стандартным `JSONEncoder` как число секунд от 2001-01-01 00:00:00 UTC.
servers:
  - url: http://localhost:8080
    description: Локальный сервер Vapor

tags:
  - name: Sections
    description: Разделы каталога и их содержимое
  - name: Authors
    description: Авторы
  - name: Books
    description: Книги, роли участников и главы
  - name: Users
    description: Пользователи, публикующие книги
  - name: Roles
    description: Роли авторов и других участников книги
  - name: Chapters
    description: Главы книги
  - name: Info
    description: Краткие метаданные для предпросмотра страниц
  - name: Views
    description: Управление файлами Leaf-шаблонов
  - name: App
    description: HTML-страницы приложения

paths:
  /api/authors/{authorID}/image:
    parameters:
      - $ref: '#/components/parameters/AuthorID'
    post:
      tags: [Authors]
      operationId: uploadAuthorImage
      summary: Загрузить или заменить изображение автора
      description: |
        Бинарное тело запроса содержит один файл, без multipart-обёртки.
        JPEG/PNG/WebP до 20971520 байт (20 MiB). Базовое изображение — PNG,
        максимум 1024 px по большой стороне без увеличения исходника.
        Превью — центральный квадрат базового изображения, 96×96 px,
        JPEG quality 80, белый фон вместо прозрачности. Вес 3–4 КБ ориентировочный.
        Обрабатывается первый кадр; ориентация EXIF учитывается, метаданные удаляются.
        Предел исходного изображения: 100 мегапикселей и 20000 px по стороне.
        Ответ возвращается после загрузки в S3 и обновления базы.
        Замена использует текущие имена сущностей и удаляет предыдущие объекты
        по сохранённым в базе ссылкам. Простое переименование не перемещает файлы.
        Медиаоперации одной сущности сериализованы обновлением ID без изменения значения через Fluent внутри транзакции.
        При ошибке выполняется попытка восстановить S3 из временных копий;
        ошибка неполного восстановления явно указана в reason.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Медиа сохранено, ссылки в базе обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResult'
        '400':
          $ref: '#/components/responses/MediaError'
        '404':
          $ref: '#/components/responses/MediaError'
        '413':
          $ref: '#/components/responses/MediaError'
        '415':
          $ref: '#/components/responses/MediaError'
        '422':
          $ref: '#/components/responses/MediaError'
        '500':
          $ref: '#/components/responses/MediaError'
        '502':
          $ref: '#/components/responses/MediaError'
        '503':
          $ref: '#/components/responses/MediaError'
    delete:
      tags: [Authors]
      operationId: deleteAuthorImage
      summary: Удалить изображение и превью автора
      description: |
        Прямая ссылка должна относиться к настроенному бакету и быть связана
        с этой сущностью в базе. URL с query/fragment не принимаются.
        Ссылка на оригинал или превью удаляет оба файла.
        Отсутствующий объект в S3 считается удалённым. После удаления ссылки
        очищаются в базе. Если ссылка уже отвязана, возвращается 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaDeleteRequest'
      responses:
        '200':
          description: Медиа удалено, ссылки в базе очищены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResult'
        '400':
          $ref: '#/components/responses/MediaError'
        '404':
          $ref: '#/components/responses/MediaError'
        '500':
          $ref: '#/components/responses/MediaError'
        '502':
          $ref: '#/components/responses/MediaError'
        '503':
          $ref: '#/components/responses/MediaError'

