          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Шаблон записан
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Views]
      operationId: deleteView
      summary: Удалить Leaf-шаблон
      responses:
        '200':
          description: Шаблон удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /app/sections:
    get:
      tags: [App]
      operationId: renderCatalog
      summary: Открыть корневую страницу каталога
      parameters:
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/XBaseUrl'
      responses:
        '200':
          $ref: '#/components/responses/HtmlResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /app/sections/{sectionName}:
    get:
      tags: [App]
      operationId: renderSection
      summary: Открыть страницу раздела
      parameters:
        - name: sectionName
          in: path
          required: true
          description: Человекочитаемое имя раздела (`name`)
          schema:
            type: string
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/XBaseUrl'
      responses:
        '200':
          $ref: '#/components/responses/HtmlResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /app/books/{bookId}:
    get:
      tags: [App]
      operationId: renderBook
      summary: Открыть страницу книги
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/XBaseUrl'
      responses:
        '200':
          $ref: '#/components/responses/HtmlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /app/authors/{authorId}:
    get:
      tags: [App]
      operationId: renderAuthor
      summary: Открыть страницу автора
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/XBaseUrl'
      responses:
        '200':
          $ref: '#/components/responses/HtmlResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /app/player/{bookId}:
    get:
      tags: [App]
      operationId: renderPlayer
      summary: Открыть страницу аудиоплеера
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/XBaseUrl'
      responses:
        '200':
          $ref: '#/components/responses/HtmlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /app/page/{template}:
    get:
      tags: [App]
      operationId: renderPageTemplate
      summary: Открыть произвольную страницу из разрешённого Leaf-шаблона
      description: Имя шаблона должно начинаться с `page-`.
      parameters:
        - name: template
          in: path
          required: true
          schema:
            type: string
            pattern: '^page-'
            example: page-info
        - $ref: '#/components/parameters/XPlatform'
        - $ref: '#/components/parameters/XBaseUrl'
      responses:
        '200':
          $ref: '#/components/responses/HtmlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Per:
      name: per
      in: query
      required: false
      description: Число элементов на странице
      schema:
        type: integer
        minimum: 1
        default: 10
    SectionID:
      name: sectionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthorID:
      name: authorID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookID:
      name: bookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleID:
      name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChapterID:
      name: chapterID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XPlatform:
      name: X-Platform
      in: header
      required: false
      description: Платформа клиента, доступная Leaf-шаблону; по умолчанию `any`
      schema:
        type: string
        default: any
    XBaseUrl:
      name: X-Base-Url
      in: header
      required: false
      description: Внешний базовый URL, обычно устанавливаемый reverse proxy
      schema:
        type: string
        format: uri

  responses:
    MediaError:
      description: |
        Ошибка с текстовым reason. 400 — неверный ID, номер главы или URL;
        404 — сущность отсутствует; 413 — превышен лимит файла;
        415 — неподдерживаемый формат; 422 — повреждённый файл или некорректное имя;
        500 — ошибка базы/локальных файлов; 502 — ошибка S3 или неполное восстановление;
        503 — S3 не настроен или недоступен обработчик изображений.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Некорректные параметры или тело запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервера или базы данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InfoResponse:
      description: Краткие метаданные ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Info'
    HtmlResponse:
      description: HTML-страница, сформированная Leaf
      content:
        text/html:
          schema:
            type: string

  schemas:
    MediaDeleteRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Прямая ссылка на текущий медиафайл этой сущности в настроенном бакете.
    MediaResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        url:
          type: string
          format: uri
          description: Базовое изображение или аудио; отсутствует после удаления.
        previewUrl:
          type: string
          format: uri
          description: JPEG-превью; отсутствует для аудио и после удаления.

    Error:
      type: object
      required: [error, reason]
      properties:
        error:
          type: boolean
          example: true
        reason:
          type: string
          example: Not Found

    PageMetadata:
      type: object
      required: [page, per, total]
      properties:
        page:
          type: integer
          minimum: 1
        per:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        previewUrl:
          type: string
          description: Ссылка на квадратное JPEG-превью 96×96; после удаления поле отсутствует.
        photoUrl:
          type: string
        link:
          type: string
        description:
          type: string
      example:
        id: 7f04819b-f03f-4aa5-a084-d830ea00cc20
        firstName: Лев
        lastName: Толстой
        photoUrl: https://cdn.example.com/authors/tolstoy.jpg
        link: https://example.com/authors/tolstoy
        description: Русский писатель

    AuthorWrite:
      type: object
      description: Все поля DTO автора необязательны. При обновлении отсутствующие photoUrl и previewUrl сохраняют прежние ссылки; остальные отсутствующие строковые поля заменяются пустыми строками.
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        previewUrl:
          type: string
          description: Ссылка на квадратное JPEG-превью 96×96; после удаления поле отсутствует.
        photoUrl:
          type: string
        link:
          type: string
        description:
          type: string

    AuthorPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        metadata:
          $ref: '#/components/schemas/PageMetadata'

    User:
      type: object
      description: Ответы API намеренно не содержат поле `pass`.
      properties:
        id:
          type: string
          format: uuid
        createDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        updateDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        deleteDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        login:
          type: string
        previewUrl:
          type: string
          description: Ссылка на квадратное JPEG-превью 96×96; после удаления поле отсутствует.
        photoUrl:
          type: string
        link:
          type: string
        description:
          type: string

    UserWrite:
      type: object
      description: Все поля DTO пользователя необязательны; при обновлении отсутствующие pass, photoUrl и previewUrl сохраняют прежние значения, остальные строковые поля заменяются пустыми строками.
      properties:
        id:
          type: string
          format: uuid
        createDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        updateDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        deleteDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        login:
          type: string
        pass:
          type: string
          writeOnly: true
        previewUrl:
          type: string
          description: Ссылка на квадратное JPEG-превью 96×96; после удаления поле отсутствует.
        photoUrl:
          type: string
        link:
          type: string
        description:
          type: string

    UserPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        metadata:
          $ref: '#/components/schemas/PageMetadata'

    Section:
      type: object
      required: [name, title, template, bookTemplate]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        name:
          type: string
          description: Человекочитаемый идентификатор для URL
        title:
          type: string
        previewUrl:
          type: string
          description: Ссылка на квадратное JPEG-превью 96×96; после удаления поле отсутствует.
        coverUrl:
          type: string
        textLink:
          type: string
        description:
          type: string
        template:
          type: string
          description: Имя Leaf-шаблона раздела
        bookTemplate:
          type: string
          description: Имя Leaf-шаблона страницы книги в этом разделе

    SectionWrite:
      type: object
      description: При обновлении отсутствующие coverUrl и previewUrl сохраняют прежние ссылки.
      required: [name, title, template, bookTemplate]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        name:
          type: string
        title:
          type: string
        previewUrl:
          type: string
          description: Ссылка на квадратное JPEG-превью 96×96; после удаления поле отсутствует.
        coverUrl:
          type: string
        textLink:
          type: string
        description:
          type: string
        template:
          type: string
        bookTemplate:
          type: string

    SectionContent:
      type: object
      required: [section, sections, books]
      properties:
        section:
          $ref: '#/components/schemas/Section'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookShort'

    RoleType:
      type: string
      enum: [author, translator, reader, host]
      description: Автор, переводчик, чтец или ведущий соответственно.

    Role:
      type: object
      required: [type]
      properties:
        id:
          type: string
          format: uuid
        createDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        updateDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        deleteDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (стандартное кодирование Swift `Date`)
        bookId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RoleType'
        author:
          $ref: '#/components/schemas/Author'
        typeString:
          type: string
          readOnly: true
          enum: [Автор, Переводчик, Чтец, Ведущий]

    RoleWrite:
      type: object
      required: [authorId, type]
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RoleType'

    RoleUpdate:
      type: object
      required: [type]
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RoleType'

    Chapter:
      type: object
      required: [title, mediaUrl]
      properties:
        id:
          type: string
          format: uuid
        createDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (в ответах главы поле не заполняется)
        updateDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (в ответах главы поле не заполняется)
        deleteDate:
          type: number
          format: double
          description: Секунды от 2001-01-01 00:00:00 UTC (в ответах главы поле не заполняется)
        bookId:
          type: string
          format: uuid
        title:
          type: string
        mediaUrl:
          type: string
        coverUrl:
          type: string
        previewUrl:
          type: string
        publishDate:
          type: number
          format: double
          description: Unix time в секундах
        link:
          type: string
        description:
          type: string
        index:
          type: integer
          minimum: 0

    ChapterWrite:
      type: object
      required: [title, mediaUrl]
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        title:
          type: string
        mediaUrl:
          type: string
        coverUrl:
          type: string
        previewUrl:
          type: string
        publishDate:
          type: number
          format: double
          description: Unix time в секундах
        link:
          type: string
        description:
          type: string
        index:
          type: integer
          minimum: 0

    Book:
      type: object
      required:
        - userId
        - authorId
        - sectionId
        - title
        - previewUrl
        - coverUrl
        - textLink
        - description
        - publishDate
        - template
      properties:
        id:
          type: string
          format: uuid
        createDate:
          type: number
          format: double
          description: Unix time в секундах
        updateDate:
          type: number
          format: double
          description: Unix time в секундах
        deleteDate:
          type: number
          format: double
          description: Unix time в секундах
        userId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        previewUrl:
          type: string
        coverUrl:
          type: string
        textLink:
          type: string
        description:
          type: string
        publishDate:
          type: number
          format: double
          description: Unix time в секундах
        template:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'

    BookCreate:
      type: object
      required:
        - userId
        - authorId
        - sectionId
        - title
        - previewUrl
        - coverUrl
        - textLink
        - description
        - publishDate
        - template
        - roles
      properties:
