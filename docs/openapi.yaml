        sectionId:
          type: string
          format: uuid
        title:
          type: string
        previewUrl:
          type: string
        coverUrl:
          type: string
        textLink:
          type: string
        description:
          type: string
        publishDate:
          type: number
          format: double
          description: Unix time в секундах
        template:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoleWrite'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterWrite'

    BookUpdate:
      type: object
      required:
        - userId
        - authorId
        - sectionId
        - title
        - previewUrl
        - coverUrl
        - textLink
        - description
        - publishDate
        - template
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        previewUrl:
          type: string
        coverUrl:
          type: string
        textLink:
          type: string
        description:
          type: string
        publishDate:
          type: number
          format: double
          description: Unix time в секундах
        template:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleWrite'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterWrite'

    BookShort:
      type: object
      required: [user, section, title, previewUrl]
      properties:
        id:
          type: string
          format: uuid
        user:
          type: string
          description: Логин пользователя
        section:
          type: string
          description: Заголовок раздела
        title:
          type: string
        previewUrl:
          type: string

    Info:
      type: object
      required: [title, description, previewUrl]
      properties:
        title:
          type: string
        description:
          type: string
        previewUrl:
          type: string
          description: Ссылка на большое изображение — coverUrl книги/раздела или photoUrl автора/пользователя, независимо от наличия маленького превью.

    FileInfo:
      type: object
      required: [filename]
      properties:
        filename:
          type: string
          example: book
